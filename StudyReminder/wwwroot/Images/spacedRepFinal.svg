<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- White to light gradient for text on purple background -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Stacked cards with perspective -->
  <g transform="translate(20, 30)">
    <!-- Back card -->
    <rect x="8" y="16" width="50" height="35" rx="6" fill="white" opacity="0.2"/>
    
    <!-- Middle card -->
    <rect x="4" y="8" width="50" height="35" rx="6" fill="white" opacity="0.4"/>
    
    <!-- Front card -->
    <rect x="0" y="0" width="50" height="35" rx="6" fill="white" opacity="0.95"/>
    
    <!-- Lines on front card -->
    <line x1="8" y1="10" x2="30" y2="10" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="17" x2="42" y2="17" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="24" x2="35" y2="24" stroke="#764ba2" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Small clock icon -->
    <circle cx="42" cy="8" r="6" fill="url(#accentGradient)"/>
    <line x1="42" y1="8" x2="42" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="8" x2="44.5" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- "SpacedRep" Text -->
  <text x="95" y="65" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)" letter-spacing="-1">
    SpacedRep
  </text>
  
  <!-- Subtle underline accent -->
  <line x1="95" y1="75" x2="380" y2="75" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Small tagline -->
  <text x="97" y="95" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.7" letter-spacing="1">
    Learn. Review. Master.
  </text>
</svg>