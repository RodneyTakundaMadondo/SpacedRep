<svg width="560" height="180" viewBox="0 0 560 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Your exact background gradient for preview (remove <rect> in production) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>

    <!-- Main text: bright cyan-blue → violet to contrast & harmonize -->
    <linearGradient id="mainGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#7dd3fc" />  <!-- light cyan -->
      <stop offset="50%"  stop-color="#60a5fa" />  <!-- bright blue -->
      <stop offset="100%" stop-color="#c084fc" />  <!-- soft violet -->
    </linearGradient>

    <!-- Strong white-cyan glow for pop on mid-tone bg -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" />
      <stop offset="40%"  stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

 

  <!-- Strong outer glow layer (white-cyan) -->
  <text
    x="280"
    y="105"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="92"
    font-weight="900"
    fill="url(#glowGrad)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-1.5"
    opacity="0.75"
    filter="url(#glowBlur)"
  >SpacedRep</text>

  <!-- Main sharp text -->
  <text
    x="280"
    y="105"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="88"
    font-weight="800"
    fill="url(#mainGrad)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-1.2"
  >SpacedRep</text>

  

  <!-- Small neon sparkles (bright cyan/violet to match) -->
  <g opacity="0.95">
    <circle cx="435" cy="48"  r="4.5" fill="#67e8f9"/>
    <circle cx="452" cy="38"  r="3"   fill="#a5f3fc"/>
    <circle cx="418" cy="58"  r="3.5" fill="#c084fc"/>
  </g>



</svg>